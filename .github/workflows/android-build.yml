name: Android Release Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Static JavaScript validation
        run: npm run lint
      - name: Validate Expo project
        run: npx expo-doctor
      - name: Validate Expo dependency compatibility
        run: npx expo install --check
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify APK and create SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk" || { echo "::error::Release APK is missing or empty"; exit 1; }

          apksigner="$(find "${ANDROID_HOME:?ANDROID_HOME is not configured}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner" || { echo "::error::Android apksigner tool was not found"; exit 1; }
          "$apksigner" verify --verbose --print-certs "$apk"

          sha256sum "$apk" | tee "${apk}.sha256"
          echo "APK size: $(stat -c '%s bytes' "$apk")"
      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: welding-workshop-crm-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
